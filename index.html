```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="A survey form to share your experience, preferences, and feedback."
  >

  <meta name="author" content="Fraterne">

  <title>Survey Form</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- JavaScript -->
  <script src="script.js" defer></script>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->
  <header class="header">
    <div class="container">
      <h1 id="title">Survey Form</h1>

      <p id="description">
        Thank you for taking the time to help us improve our platform.
      </p>
    </div>
  </header>


  <!-- =========================
       MAIN CONTENT
  ========================== -->
  <main>

    <section class="survey-section" id="survey">

      <div class="container">

        <form
          id="survey-form"
          action=""
          method="get"
        >

          <!-- =========================
               PERSONAL INFORMATION
          ========================== -->

          <div class="form-group">

            <label for="name">
              Name
            </label>

            <input
              id="name"
              name="name"
              type="text"
              placeholder="Enter your name"
              autocomplete="name"
              required
            >

          </div>


          <div class="form-group">

            <label for="email">
              Email
            </label>

            <input
              id="email"
              name="email"
              type="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            >

          </div>


          <div class="form-group">

            <label for="age">
              Age
            </label>

            <input
              id="age"
              name="age"
              type="number"
              min="13"
              max="100"
              placeholder="Enter your age"
              required
            >

          </div>


          <!-- =========================
               ROLE
          ========================== -->

          <div class="form-group">

            <label for="role">
              Which option best describes you?
            </label>

            <select
              id="role"
              name="role"
              required
            >

              <option
                value=""
                disabled
                selected
              >
                Select your role
              </option>

              <option value="student">
                Student
              </option>

              <option value="worker">
                Worker
              </option>

              <option value="unemployed">
                Unemployed
              </option>

            </select>

          </div>


          <!-- =========================
               RECOMMENDATION
          ========================== -->

          <fieldset class="form-group">

            <legend>
              Would you recommend GeeksforGeeks to a friend?
            </legend>

            <label>
              <input
                type="radio"
                name="recommend"
                value="yes"
                checked
              >
              Yes
            </label>

            <label>
              <input
                type="radio"
                name="recommend"
                value="no"
              >
              No
            </label>

            <label>
              <input
                type="radio"
                name="recommend"
                value="maybe"
              >
              Maybe
            </label>

          </fieldset>


          <!-- =========================
               LANGUAGES & FRAMEWORKS
          ========================== -->

          <fieldset class="form-group">

            <legend>
              Languages and frameworks known
            </legend>

            <label>
              <input
                type="checkbox"
                name="languages"
                value="c"
              >
              C
            </label>

            <label>
              <input
                type="checkbox"
                name="languages"
                value="cpp"
              >
              C++
            </label>

            <label>
              <input
                type="checkbox"
                name="languages"
                value="csharp"
              >
              C#
            </label>

            <label>
              <input
                type="checkbox"
                name="languages"
                value="java"
              >
              Java
            </label>

            <label>
              <input
                type="checkbox"
                name="languages"
                value="python"
              >
              Python
            </label>

            <label>
              <input
                type="checkbox"
                name="languages"
                value="javascript"
                checked
              >
              JavaScript
            </label>

            <label>
              <input
                type="checkbox"
                name="languages"
                value="react"
              >
              React
            </label>

            <label>
              <input
                type="checkbox"
                name="languages"
                value="angular"
              >
              Angular
            </label>

            <label>
              <input
                type="checkbox"
                name="languages"
                value="django"
              >
              Django
            </label>

            <label>
              <input
                type="checkbox"
                name="languages"
                value="spring"
              >
              Spring
            </label>

          </fieldset>


          <!-- =========================
               COMMENTS
          ========================== -->

          <div class="form-group">

            <label for="comments">
              Any comments or suggestions?
            </label>

            <textarea
              id="comments"
              name="comments"
              rows="5"
              placeholder="Enter your comments here"
            ></textarea>

          </div>


          <!-- =========================
               SUBMIT BUTTON
          ========================== -->

          <button
            type="submit"
            id="submit"
          >
            Submit
          </button>

        </form>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="footer">

    <div class="container">

      <p>
        &copy; 2026 Survey Form. All rights reserved.
      </p>

    </div>

  </footer>

</body>
</html>
```
