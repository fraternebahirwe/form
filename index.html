<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membership Form</title>
  <link rel="stylesheet" href="form.css">
</head>

<body>
  <main class="page">
    <section class="container">
      <h1>Membership Form</h1>
      <p class="intro">Fill out this form to join our developer community.</p>

      <form action="" method="get">
        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" type="text" placeholder="Enter your name">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
          <label for="age">Age</label>
          <input id="age" type="number" placeholder="Enter your age">
        </div>

        <div class="form-group">
          <label for="role">Which option best describes you?</label>
          <select id="role">
            <option value="">Select your role</option>
            <option value="student">Student</option>
            <option value="worker">Worker</option>
            <option value="unemployed">Unemployed</option>
          </select>
        </div>

        <fieldset>
          <legend>Would you recommend GeeksforGeeks to a friend?</legend>

          <label><input type="radio" name="recommend" checked> Yes</label>
          <label><input type="radio" name="recommend"> No</label>
          <label><input type="radio" name="recommend"> Maybe</label>
        </fieldset>

        <fieldset>
          <legend>Languages and frameworks known</legend>

          <label><input type="checkbox"> C</label>
          <label><input type="checkbox"> C++</label>
          <label><input type="checkbox"> C#</label>
          <label><input type="checkbox"> Java</label>
          <label><input type="checkbox"> Python</label>
          <label><input type="checkbox" checked> JavaScript</label>
          <label><input type="checkbox"> React</label>
          <label><input type="checkbox"> Angular</label>
          <label><input type="checkbox"> Django</label>
          <label><input type="checkbox"> Spring</label>
        </fieldset>

        <div class="form-group">
          <label for="comments">Any comments or suggestions?</label>
          <textarea id="comments" placeholder="Enter your comments here"></textarea>
        </div>

        <button type="submit">Submit</button>
      </form>
    </section>
  </main>
</body>
</html>
